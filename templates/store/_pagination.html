{% load url_tools %}
{% if page.has_other_pages %}
<nav class="pagination" aria-label="Страницы">
  {% if page.has_previous %}<a href="{% page_url page.previous_page_number %}">← Назад</a>{% endif %}
  <span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="{% page_url page.next_page_number %}">Вперёд →</a>{% endif %}
</nav>
{% endif %}
